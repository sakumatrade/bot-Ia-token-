[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "broker-sakuma"
version = "0.1.0"
description = "Broker Sakuma - research, simulation and strategy-management backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "redis>=5.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/broker_sakuma"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
